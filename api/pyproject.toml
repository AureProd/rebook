[tool.poetry]
name = "rebook"
version = "1.0.0"
description = "Website for refund books"
authors = ["AureProd <aureprod0@gmail.com>"]
license = "proprietary"

[tool.poetry.dependencies]
python = "^3.11"
wassima = "1.2.1" # Fix temporary bug with version 1.2.2
fastapi = "0.115.8"
uvicorn = "0.30.0"
PyMySQL = "1.1.1"
sqlalchemy = "^2.0.29"
cachetools = "^5.5.2"
pyjwt = "^2.10.1"
cryptography = "^44.0.1"
phonenumbers = "^9.0.1"
email-validator = "2.0.0.post2"
python-dateutil = "2.8.2"
alembic = "^1.13.1"

[tool.poetry.group.dev.dependencies]
debugpy = "^1.8.0"

[tool.poetry.group.test.dependencies]
pytest = "7.4.0"
pytest-cov = "^4.1.0"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core", "poetry>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-warnings"
