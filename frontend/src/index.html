<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">

  <!-- Import des icons FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Import de la font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Import des fichiers CSS & JS de la librairie Flatpickr, c'est un outils pour selectionner une date avec l'heure -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script> -->

  <!-- Import des fichiers de style CSS -->
  <link rel="stylesheet" href="styles/css-reset.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/home-page.css">

  <title>ReBook - Buy & Sell books</title>
</head>
<body>
  <!-- Header -->
  <header>
    <div>
      <a href="/">
        <img src="icons/logo.png"/>
        <h1>ReBook</h1>
      </a>
    </div>

    <nav>
      <a href="#">Vendre</a>
      <a href="#">Acheter</a>
      <a href="#">
        <i class="fa-regular fa-circle-user"></i>
      </a>
    </nav>
  </header>

  <!-- Categories -->
  <section class="categories">
    <h2>Rechercher par catégorie</h2>

    <div class="category-buttons">
      <button>Histoire</button>
      <button>Mathématiques</button>
      <button>Physique</button>
      <button>Technologie</button>
      <button>Psychologie</button>
      <button>Langues</button>
      <button>Autres</button>
    </div>
  </section>

  <!-- Home page media -->
  <section class="home-page-media">
    <img src="media/home-page.png" />
  </section>

  <!-- Import des scripts JavaScript de gestion des capteurs -->
  <!-- <script src="./services/" type="text/javascript" ></script> -->
